<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future Predictor</title>
<meta name="description" content="Ask anything. Get one word.">
<meta property="og:title" content="Future Predictor">
<meta property="og:description" content="Ask anything. Get one word.">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f0efec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f0efec'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%231c1917'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: only light;
    --marble: #f0efec;
    --ink: #1c1917;
    --muted: #6b6661;
    --pad: clamp(1.25rem, 6vw, 6rem);
  }

  * { box-sizing: border-box; }

  html {
    background: var(--marble);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100svh;
    padding:
      max(clamp(4.5rem, 20svh, 12rem), env(safe-area-inset-top))
      max(var(--pad), env(safe-area-inset-right))
      max(2rem, env(safe-area-inset-bottom))
      max(var(--pad), env(safe-area-inset-left));
  }

  /* The slab: soft grey clouding with a few veins, drawn once by an SVG noise filter. */
  .marble {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  form {
    border-bottom: 1px solid var(--muted);
    padding-bottom: calc(0.5rem + 1px);
  }
  form:focus-within {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 0.5rem;
  }

  input {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: inherit;
    font: inherit;
    font-size: clamp(1.5rem, 1rem + 2.2vw, 2.5rem);
    letter-spacing: -0.02em;
    line-height: 1.3;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input::placeholder { color: var(--muted); opacity: 1; }

  .slot {
    container-type: inline-size;
    margin-top: clamp(2.5rem, 9svh, 5.5rem);
  }

  #answer {
    --n: 3;
    margin: 0 0 0 -0.06em;
    padding-bottom: 0.15em; /* room for descenders under the tight line-height */
    font-size: min(clamp(6rem, 36vw, 19rem), 36svh, calc(100cqi / (var(--n) * 0.58)));
    font-weight: 600;
    letter-spacing: -0.05em;
    line-height: 0.85;
    white-space: nowrap;
  }
  #answer[data-thinking]::before {
    content: ".";
    content: "." / "";
    animation: pulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes pulse { to { opacity: 0.2; } }

  .vh {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    #answer[data-thinking]::before { animation: none; }
  }
</style>
</head>
<body>
<svg class="marble" aria-hidden="true" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0012 0.003" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 0 0.62  1.5 0 0 0 -0.62"/>
    </filter>
    <!-- Noise pushes the drawn lines around so they wander like veins instead of curves. -->
    <filter id="wander" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2200" height="1600" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.006" numOctaves="4" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="110" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f0efec"/>
  <rect x="-700" y="-700" width="3000" height="2400" filter="url(#clouds)" opacity="0.4" transform="rotate(-27 800 500)"/>
  <g filter="url(#wander)" fill="none" stroke="#6f6f75" stroke-linecap="round">
    <path d="M-150 800 C 300 660 520 610 820 440 S 1350 190 1800 40" stroke-width="16" opacity="0.05"/>
    <path d="M-150 800 C 300 660 520 610 820 440 S 1350 190 1800 40" stroke-width="1.7" opacity="0.5"/>
    <path d="M-150 330 C 250 270 480 150 780 -80" stroke-width="1.1" opacity="0.38"/>
    <path d="M480 1150 C 760 920 1050 810 1300 630 S 1600 480 1800 430" stroke-width="1.3" opacity="0.42"/>
    <path d="M820 440 C 900 530 1010 570 1140 660" stroke-width="0.8" opacity="0.32"/>
    <path d="M300 660 C 340 540 420 440 480 330" stroke-width="0.7" opacity="0.28"/>
    <path d="M1300 630 C 1340 540 1420 470 1500 360" stroke-width="0.7" opacity="0.26"/>
  </g>
</svg>

<form id="ask" autocomplete="off">
  <label class="vh" for="q">Your question</label>
  <input id="q" name="q" type="text" maxlength="200" autocomplete="off" enterkeyhint="go" spellcheck="false" placeholder="Ask anything.">
</form>
<div class="slot">
  <p id="answer" aria-live="polite" aria-atomic="true"></p>
</div>

<script>
  const WORDS = ['Yes', 'No', 'Maybe', 'Lmao', 'Bad', 'Good'];

  const form = document.getElementById('ask');
  const input = document.getElementById('q');
  const answer = document.getElementById('answer');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(pointer: fine)').matches;
  let seq = 0;
  let lastWord;

  if (finePointer) input.focus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!input.value.trim()) return;
    const id = ++seq;

    input.value = '';
    if (!finePointer) input.blur(); // drop the phone keyboard so it can't cover the answer
    answer.textContent = '';
    answer.style.setProperty('--n', 1);
    answer.dataset.thinking = '';

    await new Promise((r) => setTimeout(r, 550)); // the pause is the joke's timing
    if (id !== seq) return;

    let word;
    do word = WORDS[Math.floor(Math.random() * WORDS.length)];
    while (word === lastWord);
    lastWord = word;
    delete answer.dataset.thinking;
    answer.style.setProperty('--n', word.length + 1);
    answer.textContent = word + '.';

    if (!still.matches) answer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'linear' });
  });
</script>
</body>
</html>
